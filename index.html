<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7d0c0c">
    <title>SindauTools - Web</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="header">
        <div class="icone">
            <div class="icone-lateral"><span></span><span></span><span></span></div>
        </div>
        <nav class="nav">
            <a href="#" class="active">INICIO</a>
            <a href="https://github.com/D-Jefferson/SindauTools_Web">SOBRE</a>
            <a href="extensoes.html">EXTENSÕES</a>
        </nav>
        <div class="info">
            <div class="informacao" onclick="info()">?</div>
        </div>
    </header>
    
    <main class="container">
        <h1 class="titulo">SINDAU<span>TOOLS</span></h1>
        
        <div class="auto-botao" onclick="auto()"><a>Autenticação</a></div>
        
        <div class="menu">
            <div class="ferramenta" onclick="formatar1()">
                <img src="icones/notificacao.png" alt="Notificação" class="icone-ferramenta">
                <h2 class="titulo-ferramenta">NOTIFICAÇÃO FINANCEIRA</h2>
            </div>
            
            <div class="ferramenta" onclick="formatar2()">
                <img src="icones/vincular.png" alt="Vincular" class="icone-ferramenta">
                <h2 class="titulo-ferramenta">VINCULAR CANDIDATO</h2>
            </div>
            
            <div class="ferramenta" onclick="formatar3()">
                <img src="icones/desvincular.png" alt="Desvincular" class="icone-ferramenta">
                <h2 class="titulo-ferramenta">DESVINCULAR CANDIDATO</h2>
            </div>
            
            <div class="ferramenta" onclick="formatar4()">
                <img src="icones/matricula.png" alt="Matrícula" class="icone-ferramenta">
                <h2 class="titulo-ferramenta">ENVIAR MATRÍCULA</h2>
            </div>
        </div>
    </main>

    <div id="fundo-sobrepor" class="fundo-sobrepor">
        <span id="fechar" class="fechar">&times;</span>
        <div class="sobrepor" id="conteudo-sobrepor"></div>
    </div>
    
    <footer class="footer">
        <p>BY JEFFERSON LEVY</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
