        </div>

            <div class="perfil-info">
                <div class="perfil-nome">Suporte</div>
                <div class="perfil-tipo">Administrador</div>
            </div>
        </div>
        
        <nav class="lateral-nav">
            <a href="index.html">
                <i class="fas fa-home"></i>
                <span>Início</span>
            </a>
            <a onclick="formatador1()">
                <i class="fas fa-tools"></i>
                <span>Ferramentas</span>
            </a>
            <a href="sobre.html">
                <i class="fas fa-book"></i>
                <span>Sobre</span>
            </a>
            <a href="filtrocpf.html" class="active">
                <i class="fa-solid fa-filter"></i>
                <span>Filtro CPF</span>
            </a>
            <a href="ajuda.html">
                <i class="fas fa-info-circle"></i>
                <span>Ajuda</span>
            </a>
        </nav>
        
        <div class="assina" style="background-color: rgba(240, 248, 255, 0);">
            <p style="color: #b8b8b8;">@By Jefferson Levy</p>
        </div>
    </aside>

    <main class="container" style="margin-right: 400px;">
        <div class="pesquisa">
            <div class="sub-info">
                <a href="index.html">Início</a>
                <span class="separado">/</span>
                <span>Filtro CPF</span>
            </div>
        </div>
        
        <div class="h22"><h2>Filtro CPF</h2></div>

        <section id="filtroCPFSection" style="margin-top:20px;display: flex;" >

        <textarea id="cpfInput" placeholder="Cole aqui os CPFs, um por linha..." class="textarea-cpf" oninput="updateStats()"></textarea>
        
        <aside class="lateral-direito">

            <div id="resultsContainer"style="display: none;">
                <div>
                    <strong>CPFs Válidos:</strong>
                    <div id="validList"></div>
                </div>
                <div>
                    <strong>CPFs Inválidos:</strong>
                    <div id="invalidList"></div>
                </div>
            <div class="stats" style="margin-top:10px; font-size: 14px; color: #444;">
            <p>Válidos: <span id="validCount">0</span></p>
            <p>Inválidos: <span id="invalidCount">0</span></p>
        </div>
        </aside>  
            </div>
        </section>              
        <div style="margin-top:10px;">
            <button onclick="formatCpfs()">Formatar</button>
            <button onclick="clearInput()">Limpar</button>
            <button onclick="copyToClipboard()">Copiar</button>
            <button onclick="exportCsv()">Exportar CSV</button>
        </div>
        <div id="resultAlert" class="alert" style="display:none;">
            <span id="resultMessage"></span>
        </div>

<script src="script_filtro.js"></script>
